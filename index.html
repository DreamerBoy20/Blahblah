<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>HEHEHE</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --cream:#f4ead2;
  --pink:#d6d0c4;
  --pink2:#e7e2d8;
  --pink3:#cfcfcf;
  --dark:#161616;
  --red:#bdb7aa;
  --shadow:rgba(0,0,0,.32);
  --vh:1vh;
}

*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  overscroll-behavior:none;
  -webkit-text-size-adjust:100%;
}
body{
  background:#080808;
  display:grid;
  place-items:center;
  font-family:"Pixelify Sans",monospace;
  color:#fff;
  touch-action:manipulation;
}

.screen{
  position:relative;
  width:min(92vw,900px);
  aspect-ratio:16/9;
  overflow:hidden;
  border-radius:10px;
  background:
    radial-gradient(circle at 20% 45%,rgba(244,234,210,.10),transparent 35%),
    linear-gradient(110deg,#111 0%,#1b1b1b 52%,#0b0b0b 100%);
  box-shadow:0 0 0 2px rgba(255,255,255,.12),0 16px 45px rgba(0,0,0,.38);
}

/* tiny background speckles like the reference */
.speckles{position:absolute;inset:0;pointer-events:none}
.speck{
  position:absolute;width:3px;height:3px;border-radius:50%;
  background:rgba(255,255,255,.22);
}
.bg-heart{
  position:absolute;
  color:#fff;
  font-size:13px;
  opacity:.7;
  animation:drift 5s ease-in-out infinite;
}
@keyframes drift{
  0%,100%{transform:translateY(0) rotate(-8deg)}
  50%{transform:translateY(-12px) rotate(8deg)}
}

.intro{
  position:absolute;inset:0;
  display:flex;flex-direction:column;align-items:center;
  padding-top:13%;
  transition:opacity .65s ease,transform .65s ease;
  z-index:5;
}
.intro.hide{opacity:0;transform:scale(.96);pointer-events:none}

.envelope-wrap{
  position:relative;
  width:145px;height:103px;
  cursor:pointer;
  filter:drop-shadow(0 7px 5px rgba(85,48,53,.18));
  transition:transform .2s ease;
}
.envelope-wrap:hover{transform:translateY(-3px)}
.envelope{
  position:absolute;inset:0;
  background:#f4ead2;
  border:3px solid #777;
  border-radius:3px;
  overflow:hidden;
}
.envelope:before{
  content:"";
  position:absolute;inset:0;
  background:
    linear-gradient(34deg,transparent 49%,#777 50%,#777 51%,transparent 52%),
    linear-gradient(-34deg,transparent 49%,#777 50%,#777 51%,transparent 52%);
  opacity:.75;
}
.flap{
  position:absolute;left:0;top:0;width:100%;height:57%;
  background:#d8d2c5;
  clip-path:polygon(0 0,100% 0,50% 72%);
  border-top:2px solid #777;
  transform-origin:top center;
  transition:transform .85s cubic-bezier(.2,.8,.2,1);
  z-index:3;
}
.envelope-wrap.open .flap{transform:rotateX(180deg);z-index:0}
.seal{
  position:absolute;z-index:4;
  left:50%;top:49%;transform:translate(-50%,-50%);
  color:#fff;font-size:19px;line-height:1;
  transition:opacity .25s;
}
.envelope-wrap.open .seal{opacity:0}

.intro-title{
  margin-top:22px;
  font-size:18px;
  font-weight:600;
  letter-spacing:.2px;
}
.intro-title span{color:var(--red);font-size:13px}
.tap{
  position:absolute;bottom:11%;
  font-size:11px;
  opacity:.8;
  animation:blink 1.4s infinite;
}
.tap .heart{color:var(--red)}
@keyframes blink{50%{opacity:.42}}

.letter{
  position:absolute;
  left:50%;top:48%;
  width:108px;height:145px;
  transform:translate(-50%,20px) scale(.75);
  opacity:0;
  background:#f4ead2;
  border:2px solid #777;
  box-shadow:0 4px 8px var(--shadow);
  z-index:2;
  transition:transform .9s cubic-bezier(.16,.8,.25,1),opacity .3s;
}
.envelope-wrap.open + .letter{
  opacity:1;
  transform:translate(-50%,-98px) scale(1);
}
.letter-lines{
  margin:24px 13px;
  display:grid;gap:9px;
}
.letter-lines i{height:4px;background:#aaa;border-radius:2px}
.letter-lines i:nth-child(2){width:82%}
.letter-lines i:nth-child(3){width:65%}
.letter-lines i:nth-child(4){width:78%}

.card-stage{
  position:absolute;inset:0;
  display:grid;place-items:center;
  opacity:0;
  transform:scale(.88) translateY(12px);
  pointer-events:none;
  transition:opacity .7s ease,transform .7s cubic-bezier(.16,.8,.25,1);
  z-index:4;
}
.card-stage.show{
  opacity:1;transform:scale(1) translateY(0);pointer-events:auto;
}

.window{
  position:relative;
  width:256px;
  height:304px;
  border:3px solid #777;
  border-radius:6px;
  background:#222;
  box-shadow:0 8px 15px rgba(0,0,0,.45);
  overflow:hidden;
}

.titlebar{
  height:32px;
  background:#171717;
  border-bottom:2px solid #666;
  display:flex;align-items:center;
  padding:0 9px;
  font-size:11px;font-weight:700;
}
.window-buttons{margin-left:auto;display:flex;gap:7px}
.window-buttons b{
  width:8px;height:8px;border:2px solid #fff;
  opacity:.85;
}

/* heart toolbar */
.toolbar{
  height:31px;
  display:flex;justify-content:center;align-items:center;gap:15px;
  background:#f4ead2;
  border-bottom:2px solid #777;
  color:#fff;
  font-size:12px;
}

.content{
  position:absolute;left:0;right:0;top:63px;bottom:0;
  padding:17px 13px 12px;
  text-align:center;
  background-color:#1f1f1f;
  background-image:
    linear-gradient(rgba(255,255,255,.08) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.08) 1px,transparent 1px),
    linear-gradient(rgba(244,234,210,.08) 50%,transparent 50%),
    linear-gradient(90deg,rgba(244,234,210,.08) 50%,transparent 50%);
  background-size:10px 10px,10px 10px,20px 20px,20px 20px;
}

.message{
  font-size:19px;
  line-height:1.04;
  font-weight:600;
  margin:0 auto 9px;
  max-width:225px;
  color:#fff;
  text-shadow:1px 1px 0 rgba(0,0,0,.35);
}

.couple{
  position:relative;
  width:145px;height:105px;
  margin:0 auto 2px;
  image-rendering:pixelated;
}
.head{
  position:absolute;width:50px;height:57px;
  background:#18151a;
  top:14px;
}
.head.left{left:22px;border-radius:4px 4px 13px 13px}
.head.right{right:22px;border-radius:4px 4px 13px 13px}
.ear{
  position:absolute;top:-8px;width:15px;height:22px;background:#18151a;
}
.left .ear{left:3px}.right .ear{right:3px}
.eye{
  position:absolute;top:18px;width:9px;height:6px;background:#fff;
}
.left .eye{left:10px}.right .eye{right:10px}
.face-pink{
  position:absolute;bottom:13px;left:50%;transform:translateX(-50%);
  width:23px;height:17px;background:#777;
}
.body-heart{
  position:absolute;left:50%;top:45px;
  transform:translateX(-50%) rotate(45deg);
  width:28px;height:28px;background:#777;
  z-index:4;
}
.body-heart:before,.body-heart:after{
  content:"";position:absolute;width:28px;height:28px;background:#777;border-radius:50%;
}
.body-heart:before{left:-14px;top:0}
.body-heart:after{left:0;top:-14px}
.body{
  position:absolute;left:28px;right:28px;bottom:8px;height:34px;
  background:#18151a;border-radius:6px;
}
.hand{
  position:absolute;width:22px;height:10px;background:#18151a;top:57px;
}
.hand.l{left:12px;transform:rotate(24deg)}
.hand.r{right:12px;transform:rotate(-24deg)}
.pixel-white{
  position:absolute;background:#fff;
}
.shirt-detail{
  position:absolute;width:12px;height:7px;background:#f5a8b9;
  left:50%;bottom:17px;transform:translateX(-50%);
}

.note{
  position:absolute;
  right:22px;top:154px;
  width:37px;height:25px;
  background:#f4ead2;border:2px solid #e2a2ae;
  font-size:8px;display:grid;place-items:center;
  transform:rotate(-2deg);
  opacity:0;
  transition:opacity .3s;
}
.note.show{opacity:1}

.choices{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:10px;
  margin-top:3px;
  min-height:41px;
  position:relative;
}

.yes{
  display:block;
  margin:3px auto 0;
  min-width:72px;height:37px;
  padding:0 15px;
  border:2px solid #777;
  border-radius:3px;
  background:#f4ead2;
  color:#030202;
  font-family:inherit;font-size:14px;font-weight:700;
  box-shadow:0 3px 0 #555;
  cursor:pointer;
  transition:transform .12s,box-shadow .12s;
}
.yes:hover{transform:translateY(-2px)}
.yes:active{transform:translateY(2px);box-shadow:0 1px 0 #555}


.no{
  min-width:72px;
  height:37px;
  padding:0 15px;
  border:2px solid #777;
  border-radius:3px;
  background:#f4ead2;
  color:#060404;
  font-family:inherit;
  font-size:14px;
  font-weight:700;
  box-shadow:0 3px 0 #555;
  cursor:pointer;
  position:relative;
  z-index:30;
  touch-action:none;
  -webkit-tap-highlight-color:transparent;
  transition:left .16s ease,top .16s ease,transform .12s ease;
}
.no:hover{
  transform:translateY(-2px);
}
.no.running{
  position:fixed;
  transition:left .16s ease,top .16s ease;
}
.window.accepted .no,
.no.hidden{
  opacity:0;
  pointer-events:none;
}

.final-msg{
  position:absolute;left:0;right:0;top:17px;
  font-size:20px;font-weight:600;line-height:1.05;
  opacity:0;transform:translateY(8px);
  transition:.45s;
}
.final-msg.show{opacity:1;transform:none}
.final-msg small{display:block;font-size:14px;margin-top:3px;color:#e84966}

.window.accepted .message{opacity:0;transform:translateY(-8px);transition:.35s}
.window.accepted .couple{transform:scale(1.04);transition:.5s}
.window.accepted .yes{opacity:0;pointer-events:none}
.window.accepted .final-msg{opacity:1;transform:none}


.celebration{
  position:absolute;inset:0;pointer-events:none;z-index:10;overflow:hidden;
}
.celebrate-heart{
  position:absolute;
  bottom:35%;
  font-size:20px;
  color:#fff;
  animation:burst 2.1s cubic-bezier(.15,.7,.25,1) forwards;
  text-shadow:0 2px 0 rgba(0,0,0,.25);
}
@keyframes burst{
  0%{opacity:0;transform:translate(0,20px) scale(.4) rotate(0)}
  12%{opacity:1}
  100%{opacity:0;transform:translate(var(--x),var(--y)) scale(var(--s)) rotate(var(--r))}
}

.cursor{
  position:absolute;
  width:12px;height:17px;
  border-left:2px solid #333;
  border-top:2px solid #fff;
  transform:rotate(-18deg);
  opacity:0;
  pointer-events:none;
  z-index:20;
}
@keyframes clickmove{
  0%{opacity:0;transform:translate(20px,20px) rotate(-18deg)}
  25%{opacity:1}
  65%{opacity:1;transform:translate(0,0) rotate(-18deg)}
  100%{opacity:0;transform:translate(0,0) rotate(-18deg)}
}
.cursor.play{animation:clickmove 1.1s ease forwards}

@media(max-width:768px){
  .screen{
    width:100vw;
    height:calc(var(--vh,1vh) * 100);
    aspect-ratio:auto;
    border-radius:0;
  }
}
@media(max-width:560px){
  .window{transform:scale(.82)}
  .card-stage.show{transform:scale(1)}
  .intro{padding-top:12%}
  .envelope-wrap{transform:scale(.86)}
  .intro-title{font-size:15px}
  .tap{font-size:9px;padding:0 10%;text-align:center}
}
@media(max-width:380px),(max-height:600px){
  .window{transform:scale(.7)}
  .envelope-wrap{transform:scale(.75)}
}
@media(hover:none) and (pointer:coarse){
  .yes:hover,.no:hover{transform:none}
}
</style>
</head>

<body>
<main class="screen" id="screen">
  <div class="speckles" id="speckles"></div>

  <section class="intro" id="intro">
    <div class="envelope-wrap" id="envelope" aria-label="Open the envelope">
      <div class="envelope"></div>
      <div class="flap"></div>
      <div class="seal">+</div>
    </div>

    <div class="letter" id="letter">
      <div class="letter-lines">
        <i></i><i></i><i></i><i></i>
      </div>
    </div>

    <div class="intro-title">
      Pindota 
    </div>

    <div class="cursor" id="cursor"></div>
  </section>

  <section class="card-stage" id="cardStage">
    <div class="window" id="window">
      <div class="titlebar">
        
        <div class="window-buttons"><b></b><b></b><b></b></div>
      </div>

      <div class="toolbar">
      </div>

      <div class="content">
        <div class="message" id="message">
          Gusto ka mo pasar para ogma?
        </div>

        <div class="final-msg" id="finalMsg">
          Jk lang 😭 Mapasar lagi ka
        </div>

        <div class="couple" id="couple">
          <div class="head left">
            <i class="ear"></i><i class="eye"></i>
          </div>
          <div class="head right">
            <i class="ear"></i><i class="eye"></i>
          </div>
          <div class="hand l"></div>
          <div class="hand r"></div>
          <div class="body"></div>
          <div class="shirt-detail"></div>
          <div class="body-heart"></div>
        </div>

        <div class="note" id="note">♥</div>

        <div class="choices"><button class="yes" id="yes">NO</button><button class="no" id="no">YES</button></div>
      </div>
    </div>
  </section>

  <div class="celebration" id="celebration"></div>
</main>

<script>
function setVH(){
  const h = (window.visualViewport ? window.visualViewport.height : window.innerHeight);
  document.documentElement.style.setProperty('--vh', (h * 0.01) + 'px');
}
setVH();
window.addEventListener('resize', setVH);
window.addEventListener('orientationchange', setVH);
if (window.visualViewport){
  window.visualViewport.addEventListener('resize', setVH);
  window.visualViewport.addEventListener('scroll', setVH);
}

window.addEventListener('load', () => setTimeout(setVH, 300));

const screen = document.getElementById("screen");
const intro = document.getElementById("intro");
const envelope = document.getElementById("envelope");
const cardStage = document.getElementById("cardStage");
const windowCard = document.getElementById("window");
const yes = document.getElementById("yes");
const cursor = document.getElementById("cursor");

let opened = false;
let holding = false;
let holdTimer;

function random(min,max){return Math.random()*(max-min)+min}

for(let i=0;i<42;i++){
  const s=document.createElement("span");
  s.className="speck";
  s.style.left=random(2,98)+"%";
  s.style.top=random(3,96)+"%";
  s.style.opacity=random(.18,.65);
  s.style.transform=`scale(${random(.5,1.5)})`;
  document.getElementById("speckles").appendChild(s);
}

function openEnvelope(){
  if(opened) return;
  opened=true;
  envelope.classList.add("open");

  cursor.style.left="calc(50% + 65px)";
  cursor.style.top="48%";
  cursor.classList.remove("play");
  void cursor.offsetWidth;
  cursor.classList.add("play");

  setTimeout(()=>{
    intro.classList.add("hide");
    cardStage.classList.add("show");
  },950);
}

envelope.addEventListener("click",openEnvelope);

envelope.addEventListener("pointerdown",()=>{
  holding=true;
  holdTimer=setTimeout(openEnvelope,650);
});
["pointerup","pointerleave","pointercancel"].forEach(e=>{
  envelope.addEventListener(e,()=>{
    holding=false;
    clearTimeout(holdTimer);
  });
});

const no = document.getElementById("no");

function moveNoButton(){
  if (no.parentElement !== document.body){
    document.body.appendChild(no);
  }

  const pad = 8;
  const windowRect = windowCard.getBoundingClientRect();
  const rect = no.getBoundingClientRect();

  no.classList.add("running");

  const minX = windowRect.left + pad;
  const minY = windowRect.top + pad;
  const maxX = Math.max(minX, windowRect.right - rect.width - pad);
  const maxY = Math.max(minY, windowRect.bottom - rect.height - pad);

  let x = random(minX, maxX);
  let y = random(minY, maxY);

  if (window.lastPointerX !== undefined){
    for(let i=0;i<12;i++){
      x = random(minX, maxX);
      y = random(minY, maxY);
      const dx = x + rect.width/2 - window.lastPointerX;
      const dy = y + rect.height/2 - window.lastPointerY;
      if(Math.hypot(dx,dy) > 150) break;
    }
  }

  no.style.left = x + "px";
  no.style.top = y + "px";
}

no.addEventListener("pointerenter", moveNoButton);
no.addEventListener("pointerdown", e => {
  e.preventDefault();
  moveNoButton();
});
no.addEventListener("click", e => {
  e.preventDefault();
  moveNoButton();
});
no.addEventListener("touchstart", e => {
  e.preventDefault();
  window.lastPointerX = e.touches[0].clientX;
  window.lastPointerY = e.touches[0].clientY;
  moveNoButton();
}, {passive:false});

document.addEventListener("pointermove", e => {
  window.lastPointerX = e.clientX;
  window.lastPointerY = e.clientY;

  if(!no.classList.contains("running")) return;

  const r = no.getBoundingClientRect();
  const cx = r.left + r.width/2;
  const cy = r.top + r.height/2;

  if(Math.hypot(e.clientX-cx, e.clientY-cy) < 95){
    moveNoButton();
  }
});

document.addEventListener("touchmove", e => {
  const t = e.touches[0];
  if(!t) return;
  window.lastPointerX = t.clientX;
  window.lastPointerY = t.clientY;

  if(!no.classList.contains("running")) return;

  const r = no.getBoundingClientRect();
  const cx = r.left + r.width/2;
  const cy = r.top + r.height/2;

  if(Math.hypot(t.clientX-cx, t.clientY-cy) < 95){
    moveNoButton();
  }
}, {passive:true});

let viewportChangeTimer;
function handleViewportChange(){
  clearTimeout(viewportChangeTimer);
  viewportChangeTimer = setTimeout(() => {
    if(no.classList.contains("running")) moveNoButton();
  }, 150);
}
window.addEventListener("resize", handleViewportChange);
window.addEventListener("orientationchange", handleViewportChange);
if (window.visualViewport){
  window.visualViewport.addEventListener("resize", handleViewportChange);
}

yes.addEventListener("click",()=>{
  windowCard.classList.add("accepted");
  no.classList.add("hidden");
});


yes.addEventListener("keydown",e=>{
  if(e.key==="Enter" || e.key===" "){e.preventDefault();yes.click()}
});
</script>
</body>
</html>
